name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  # Manuell auslösbar: ein Push löst nicht immer einen Run aus (siehe 546bc95,
  # gepusht ohne dass Actions je ein Event verarbeitet hat). Damit lässt sich
  # ein Run nachholen, ohne einen Leer-Commit zu erzeugen.
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dev tools
        run: pip install ruff mypy huggingface_hub python-dotenv

      - name: ruff check
        run: ruff check hf_sync.py

      - name: ruff format
        run: ruff format --check hf_sync.py

      - name: mypy
        run: mypy hf_sync.py
